openapi: 3.0.3
info:
  title: UnivAPI - OpenAPI 3.0
  description: API de l'université de Lorraine
  version: 0.0.1
paths:
  /school/{schoolId}:
    get:
      summary: Get a school by ID
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Numéro de page
        - in: query
          name: per-pages
          schema:
            type: integer
            default: 10
          description: Nombre par page

      responses:
        200:
          description: OK
        500:
          description: Server error
        400:
          description: Bad request
        401:
          description: Bad auth
        404:
          description: Not found

  /school:
    post:
      summary: Post
      security:
        - bearerAuth: []
      parameters:
        - in: formData
          name: name
          schema:
            type: string
          description: A school's name
        - in: formData
          name: address
          schema:
            type: string
          description: A school's address
      responses:
        200:
          description: OK
        500:
          description: Server error
        400:
          description: Bad request
        401:
          description: Bad auth
        404:
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT