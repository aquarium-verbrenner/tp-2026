openapi: 3.0.3
info:
  title: UnivAPI - OpenAPI 3.0
  description: API de l'université de Lorraine
  version: 0.0.1
paths:
  /school/{schoolId}:
    get:
      summary: Get a school by ID
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Numéro de page
        - in: query
          name: per-pages
          schema:
            type: integer
            default: 10
          description: Nombre par page

      responses:
        200:
          description: OK
        500:
          description: Server error
        400:
          description: Bad request
        401:
          description: Bad auth
        404:
          description: Not found

  /school:
    post:
      summary: Add a school
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/school"
      responses:
        200:
          description: OK
        500:
          description: Server error
        400:
          description: Bad request
        401:
          description: Bad auth
        404:
          description: Not found
          
    put:
      summary: Modify a school
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/school"

      responses:
        200:
          description: OK
        500:
          description: Server error
        400:
          description: Bad request
        401:
          description: Bad auth
        404:
          description: Not found

    delete:
      summary: Remove a school
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/school"
      responses:
        200:
          description: OK
        500:
          description: Server error
        400:
          description: Bad request
        401:
          description: Bad auth
        404:
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    school:
      type: object
      properties:
        nom:
          type: string
          example: "ISFATES"